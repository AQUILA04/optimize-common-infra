receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  resource:
    attributes:
      - key: service.namespace
        value: optimizesolux
        action: upsert
  attributes:
    actions:
      - key: deployment.environment
        action: insert
        value: prod
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  # Traces/logs stay on debug until profile `tracing` (Jaeger) is enabled.
  # See docs/OBSERVABILITY.md to forward traces to jaeger:4317.
  debug:
    verbosity: basic

extensions:
  health_check: {}

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource, attributes, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [resource, attributes, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [resource, attributes, batch]
      exporters: [debug]
