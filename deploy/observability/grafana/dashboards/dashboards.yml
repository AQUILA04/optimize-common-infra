apiVersion: 1

providers:
  - name: optimizesolux
    orgId: 1
    folder: OptimizeSolux
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json

  - name: elykia
    orgId: 1
    folder: Elykia
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/elykia
