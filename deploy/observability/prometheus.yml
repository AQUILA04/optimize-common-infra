global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          instance: prometheus

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: contabo-vps

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: contabo-vps

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          instance: otel-collector

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          instance: redis

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels:
          instance: minio

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:8080"]
        labels:
          instance: keycloak

  - job_name: elykia-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 30s
    static_configs:
      - targets: ["elykia-backend:8080"]
        labels:
          instance: elykia-prod
          product: elykia
