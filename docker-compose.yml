# Optimize Common Infra — shared tools stack (Contabo)
# Networks: optimizesolux-common + traefik-public (both external)
# Profiles: core (default), observability, mesh, kafka, rabbitmq, tracing, ai
#
# install.sh enables: core + observability + mesh by default
# ai is NEVER enabled unless --enable ai

name: optimizesolux-common

x-common-networks: &common-networks
  - optimizesolux-common
  - traefik-public

services:
  # ---------------------------------------------------------------------------
  # CORE
  # ---------------------------------------------------------------------------
  keycloak-db:
    profiles: ["core"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD required}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - optimizesolux-common

  keycloak:
    profiles: ["core"]
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.2.5}
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-auth.optimizesolux.com}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Keep /metrics on the main HTTP port for Prometheus scrape (keycloak:8080)
      KC_LEGACY_OBSERVABILITY_INTERFACE: "true"
      KC_HTTP_PORT: "8080"
      KC_SPI_THEME_WELCOME_THEME: ${KC_SPI_THEME_WELCOME_THEME:-optimizesolux}
    volumes:
      - ./images/keycloak/realms:/opt/keycloak/data/import:ro
      # Themes synced from git on force-update — no image rebuild required for CSS/FTL tweaks.
      - ./images/keycloak/themes:/opt/keycloak/themes:ro
    networks: *common-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oci-keycloak.rule=Host(`${KEYCLOAK_HOSTNAME:-auth.optimizesolux.com}`)"
      - "traefik.http.routers.oci-keycloak.entrypoints=websecure"
      - "traefik.http.routers.oci-keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.services.oci-keycloak.loadbalancer.server.port=8080"

  redis:
    profiles: ["core"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - optimizesolux-common

  artemis:
    profiles: ["core"]
    image: apache/activemq-artemis:2.40.0
    restart: unless-stopped
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:?ARTEMIS_PASSWORD required}
    volumes:
      - artemis_data:/var/lib/artemis-instance
      - ./deploy/artemis/prepare-artemis.sh:/prepare-artemis.sh:ro
      - ./deploy/artemis/plugins:/opt/oci-artemis-plugins:ro
    # Strip leftover Prometheus plugin config, then stock entrypoint.
    # Broker metrics via cAdvisor — see docs/OBSERVABILITY.md.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /bin/bash /prepare-artemis.sh || true
        exec /docker-run.sh run
    networks: *common-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oci-artemis.rule=Host(`${ARTEMIS_CONSOLE_HOSTNAME:-artemis.optimizesolux.com}`)"
      - "traefik.http.routers.oci-artemis.entrypoints=websecure"
      - "traefik.http.routers.oci-artemis.tls.certresolver=letsencrypt"
      - "traefik.http.services.oci-artemis.loadbalancer.server.port=8161"

  minio:
    profiles: ["core"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      # Scrape Prometheus from optimizesolux-common only (no public Traefik route for /metrics)
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
    networks: *common-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oci-minio.rule=Host(`${MINIO_HOSTNAME:-s3.optimizesolux.com}`)"
      - "traefik.http.routers.oci-minio.entrypoints=websecure"
      - "traefik.http.routers.oci-minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.oci-minio.loadbalancer.server.port=9000"
      - "traefik.http.routers.oci-minio-console.rule=Host(`${MINIO_CONSOLE_HOSTNAME:-s3-console.optimizesolux.com}`)"
      - "traefik.http.routers.oci-minio-console.entrypoints=websecure"
      - "traefik.http.routers.oci-minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.oci-minio-console.service=oci-minio-console"
      - "traefik.http.services.oci-minio-console.loadbalancer.server.port=9001"

  mailpit:
    profiles: ["core"]
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    networks: *common-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oci-mailpit.rule=Host(`${MAILPIT_HOSTNAME:-mail.optimizesolux.com}`)"
      - "traefik.http.routers.oci-mailpit.entrypoints=websecure"
      - "traefik.http.routers.oci-mailpit.tls.certresolver=letsencrypt"
      - "traefik.http.services.oci-mailpit.loadbalancer.server.port=8025"

  vault:
    profiles: ["core"]
    image: hashicorp/vault:1.17.6
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: https://${VAULT_HOSTNAME:-vault.optimizesolux.com}
      VAULT_LOCAL_CONFIG: |
        ui = true
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = 1
        }
        storage "file" {
          path = "/vault/data"
        }
        disable_mlock = true
    command: server
    volumes:
      - ${VAULT_DATA_PATH:-./vault/data}:/vault/data
      - ./deploy/vault/policies:/vault/policies:ro
    networks: *common-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oci-vault.rule=Host(`${VAULT_HOSTNAME:-vault.optimizesolux.com}`)"
      - "traefik.http.routers.oci-vault.entrypoints=websecure"
      - "traefik.http.routers.oci-vault.tls.certresolver=letsencrypt"
      - "traefik.http.services.oci-vault.loadbalancer.server.port=8200"

  pgadmin:
    profiles: ["core"]
    image: dpage/pgadmin4:8.14
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@optimizesolux.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD required}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: *common-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oci-pgadmin.rule=Host(`${PGADMIN_HOSTNAME:-pgadmin.optimizesolux.com}`)"
      - "traefik.http.routers.oci-pgadmin.entrypoints=websecure"
      - "traefik.http.routers.oci-pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.oci-pgadmin.loadbalancer.server.port=80"

  # ---------------------------------------------------------------------------
  # OBSERVABILITY
  # ---------------------------------------------------------------------------
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - optimizesolux-common

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: *common-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oci-prometheus.rule=Host(`${PROMETHEUS_HOSTNAME:-prometheus.optimizesolux.com}`)"
      - "traefik.http.routers.oci-prometheus.entrypoints=websecure"
      - "traefik.http.routers.oci-prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.oci-prometheus.loadbalancer.server.port=9090"

  loki:
    profiles: ["observability"]
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - optimizesolux-common

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:2.9.8
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./deploy/observability/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    networks:
      - optimizesolux-common

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOSTNAME:-grafana.optimizesolux.com}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks: *common-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oci-grafana.rule=Host(`${GRAFANA_HOSTNAME:-grafana.optimizesolux.com}`)"
      - "traefik.http.routers.oci-grafana.entrypoints=websecure"
      - "traefik.http.routers.oci-grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.oci-grafana.loadbalancer.server.port=3000"

  node-exporter:
    profiles: ["observability"]
    image: prom/node-exporter:v1.8.0
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - optimizesolux-common

  cadvisor:
    profiles: ["observability"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--housekeeping_interval=15s"
      - "--docker_only=true"
      - "--containerd=/run/containerd/containerd.sock"
      - "--containerd-namespace=moby"
      # Do not override enable_metrics with a narrow list — defaults already cover cpu/memory/network.
      - "--store_container_labels=true"
      - "--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,com.docker.compose.container-number"
    networks:
      - optimizesolux-common

  redis-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    depends_on:
      - redis
    networks:
      - optimizesolux-common

  # ---------------------------------------------------------------------------
  # MESH
  # ---------------------------------------------------------------------------
  eureka:
    profiles: ["mesh"]
    image: ${EUREKA_IMAGE:-ghcr.io/aquila04/optimize-common-infra-eureka:latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: "8761"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    networks: *common-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oci-eureka.rule=Host(`${EUREKA_HOSTNAME:-eureka.optimizesolux.com}`)"
      - "traefik.http.routers.oci-eureka.entrypoints=websecure"
      - "traefik.http.routers.oci-eureka.tls.certresolver=letsencrypt"
      - "traefik.http.services.oci-eureka.loadbalancer.server.port=8761"

  gateway:
    profiles: ["mesh"]
    image: ${GATEWAY_IMAGE:-ghcr.io/aquila04/optimize-common-infra-gateway:latest}
    restart: unless-stopped
    depends_on:
      - eureka
    environment:
      SERVER_PORT: "8080"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    networks: *common-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oci-gateway.rule=Host(`${GATEWAY_HOSTNAME:-gateway.optimizesolux.com}`)"
      - "traefik.http.routers.oci-gateway.entrypoints=websecure"
      - "traefik.http.routers.oci-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.oci-gateway.loadbalancer.server.port=8080"

  # ---------------------------------------------------------------------------
  # OPT-IN: kafka
  # ---------------------------------------------------------------------------
  zookeeper:
    profiles: ["kafka"]
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - optimizesolux-common

  kafka:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - optimizesolux-common

  # ---------------------------------------------------------------------------
  # OPT-IN: rabbitmq
  # ---------------------------------------------------------------------------
  rabbitmq:
    profiles: ["rabbitmq"]
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-optimizesolux}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS required when rabbitmq enabled}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: *common-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oci-rabbitmq.rule=Host(`${RABBITMQ_HOSTNAME:-rabbitmq.optimizesolux.com}`)"
      - "traefik.http.routers.oci-rabbitmq.entrypoints=websecure"
      - "traefik.http.routers.oci-rabbitmq.tls.certresolver=letsencrypt"
      - "traefik.http.services.oci-rabbitmq.loadbalancer.server.port=15672"

  # ---------------------------------------------------------------------------
  # OPT-IN: tracing
  # ---------------------------------------------------------------------------
  jaeger:
    profiles: ["tracing"]
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: *common-networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.oci-jaeger.rule=Host(`${JAEGER_HOSTNAME:-jaeger.optimizesolux.com}`)"
      - "traefik.http.routers.oci-jaeger.entrypoints=websecure"
      - "traefik.http.routers.oci-jaeger.tls.certresolver=letsencrypt"
      - "traefik.http.services.oci-jaeger.loadbalancer.server.port=16686"

  # ---------------------------------------------------------------------------
  # OPT-IN: ai — NEVER default; install.sh --enable ai only
  # ---------------------------------------------------------------------------
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.5.4
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - optimizesolux-common

volumes:
  keycloak_db_data:
  redis_data:
  artemis_data:
  minio_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  loki_data:
  zookeeper_data:
  kafka_data:
  rabbitmq_data:
  ollama_data:

networks:
  optimizesolux-common:
    name: optimizesolux-common
    external: true
  traefik-public:
    name: traefik-public
    external: true
