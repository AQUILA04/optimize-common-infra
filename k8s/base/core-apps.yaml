apiVersion: apps/v1
kind: Deployment
metadata:
  name: artemis
  namespace: optimizesolux-common
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artemis
  template:
    metadata:
      labels:
        app: artemis
    spec:
      containers:
        - name: artemis
          image: apache/activemq-artemis:2.40.0
          env:
            - name: ARTEMIS_USER
              value: artemis
            - name: ARTEMIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oci-secrets
                  key: ARTEMIS_PASSWORD
          ports:
            - containerPort: 61616
              name: core
            - containerPort: 8161
              name: console
---
apiVersion: v1
kind: Service
metadata:
  name: artemis
  namespace: optimizesolux-common
spec:
  selector:
    app: artemis
  ports:
    - name: core
      port: 61616
      targetPort: core
    - name: console
      port: 8161
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: optimizesolux-common
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-12-18T13-15-44Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: oci-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oci-secrets
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: optimizesolux-common
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
